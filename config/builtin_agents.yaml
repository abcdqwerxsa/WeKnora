# Built-in Agent Configuration with i18n support
# Each agent has localized name, description, avatar, and config overrides per language.
# The "default" locale is used as fallback when the user's language is not found.

builtin_agents:
  - id: "builtin-quick-answer"
    avatar: ""
    is_builtin: true
    i18n:
      default:
        name: "Direct Chat"
        description: "Chat directly with the LLM, no knowledge base required"
      zh-CN:
        name: "默认对话"
        description: "直接与大模型对话，不依赖知识库"
      zh-TW:
        name: "預設對話"
        description: "直接與大模型對話，不依賴知識庫"
      ja-JP:
        name: "デフォルト会話"
        description: "ナレッジベースなしでLLMと直接会話"
      ko-KR:
        name: "기본 대화"
        description: "지식 베이스 없이 LLM과 직접 대화"
    config:
      agent_mode: "quick-answer"
      # Use the permissive direct_chat prompt so greetings / chitchat / general
      # questions are answered naturally instead of being forced through the
      # KB-grounded "default_kb" template.
      system_prompt_id: "direct_chat"
      context_template_id: "default_context"
      temperature: 0.7
      max_completion_tokens: 0
      web_search_enabled: false
      multi_turn_enabled: true
      history_turns: 5
      # 自由对话 agent 默认不需要推荐问题——避免预设用户思考方向
      question_suggestions:
        starters:
          enabled: false
          mode: knowledge
          count: 6
          items: []
        follow_ups:
          enabled: false
          mode: hybrid
          count: 3
      # No KB auto-selection — Direct Chat talks to the model alone. Users can
      # still @mention a knowledge base in the input field if they want RAG.
      kb_selection_mode: "none"
      retrieve_kb_only_when_mentioned: false
      faq_priority_enabled: false
      enable_query_expansion: false
      enable_rewrite: false
      fallback_strategy: "model"
      display_group: "chat"

  - id: "builtin-doc-review-proofread-chat"
    avatar: "📋"
    is_builtin: true
    i18n:
      default:
        name: "Document & Bid Reviewer"
        description: "Review documents across four dimensions (typos, formatting, KB template compliance, data consistency) AND compare bidding documents (extract scoring tables, detect deviations/omissions). Optional auto-fix to .docx."
      zh-CN:
        name: "文档与招投标审查"
        description: "覆盖两个场景：①四维度文档审查（错别字/格式/模板/数据一致性），②招投标文件智能比对（拆解评分表、识别满足/正偏离/负偏离/缺失）。可按审查结果直接生成修改版 Word。"
      zh-TW:
        name: "文檔與招投標審查"
        description: "覆蓋兩個場景：①四維度文檔審查（錯別字/格式/模板/資料一致性），②招投標文檔智慧比對（拆解評分表、識別滿足/正負偏離/缺失）。可按審查結果直接生成修改版 Word。"
      en-US:
        name: "Document & Bid Reviewer"
        description: "Two scenarios: ①four-dimension document review (typos/format/template/data consistency), ②bid document comparison (extract scoring tables, detect satisfied/positive deviation/negative deviation/missing). Optional auto-fix to .docx."
      ja-JP:
        name: "ドキュメント・入札審査"
        description: "2つのシナリオ：①4軸文書審査（誤字・書式・テンプレート・データ整合）、②入札文書スマート比較（採点表分解、満足/正負偏离/欠落識別）。審査結果から修正版 Word を直接生成可能。"
      ko-KR:
        name: "문서·입찰 심사"
        description: "두 가지 시나리오: ①4차원 문서 심사(오자/서식/템플릿/데이터 일관성), ②입찰 문서 스마트 비교(채점표 분해, 만족/정·부편차/누락 식별). 심사 결과로 수정본 Word 직접 생성 가능."
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "doc_review_proofread_chat"
      temperature: 0.1
      max_completion_tokens: 8192
      max_iterations: 50
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      retain_retrieval_history: false
      allowed_tools:
        - "knowledge_search"
        - "grep_chunks"
        - "get_document_info"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true
      history_turns: 0
      embedding_top_k: 5
      keyword_threshold: 0.2
      vector_threshold: 0.4
      rerank_top_k: 5
      rerank_threshold: 0.2
      enable_query_expansion: true
      enable_rewrite: false
      # Skills + Sandbox：让校对 agent 能在用户要求时调 bid_gen 生成 .docx。
      # skills_selection_mode="all" 把工作区沙箱里安装的 bid_gen 全部放开。
      # sandbox_config_id 指向工作区里已有的 contract-review-docker 配置。
      # initializeSkillsManager 看到沙箱就绪 + skills_selection_mode=all，会自动注入
      # read_skill / execute_skill_script / shell_exec / write_sandbox_file 等工具。
      skills_selection_mode: "all"
      sandbox_config_id: "cd4aff88-0880-424a-826c-3cd44de713e4"
      question_suggestions:
        starters:
          enabled: true
          mode: hybrid
          count: 10
          items:
            # ── 场景 1: 文档审查（四维度）──
            - "请检查文档中的错别字、标点和术语问题"
            - "请检查格式规范：字体、字号、段落缩进、行距、编号样式"
            - "请核对文档是否满足公司知识库模板要求（章节、必填字段、命名约定）"
            - "请检查长文档中前后数据一致性（金额、日期、编号、人员）"
            - "请生成完整的文档审查报告，按四维度分组排序"
            - "请直接修复所有审查问题，并把修改后的 Word 给我"
            # ── 场景 2: 招投标比对 ──
            - "请对比招标文件评分表和我们的投标文件，列出满足/正偏离/负偏离/缺失项"
            - "请拆解招标文件的商务标评分表（含权重、评分标准、否决项），并打分"
            - "请拆解招标文件的技术标评分表，检查我们的技术应答是否漏项或违规"
            - "请检查投标报价是否超过最高限价，项目经理/资质是否符合招标要求"
            - "请把比对结果写为修订痕迹到投标文件 docx，并给出修改优先级"

      # 对话专用：四维度文档审查，Markdown 报告给终端用户阅读。
      # display_group=chat 让它出现在聊天下拉。
      # 沙箱工具 (read_skill / execute_skill_script / write_sandbox_file 等) 不在 allowed_tools 字段过滤，
      # 由 initializeSkillsManager 单独注入（依赖 skills_selection_mode="all" + sandbox_config_id）。
      display_group: "chat"

  - id: "builtin-doc-generation-chat"
    avatar: "📝"
    is_builtin: true
    i18n:
      default:
        name: "Bid Document Writer"
        description: "Write tender / commercial / technical bid responses grounded in scoring criteria, historical bids, industry standards, and enterprise qualifications. Markdown → optional docx."
      zh-CN:
        name: "投标文件编写"
        description: "编写投标 / 商务响应 / 技术应答的智能体；基于招标文件评分项与历史标书、行业规范、企业资质材料，生成满足评标办法的投标文件草稿，可转 docx。"
      zh-TW:
        name: "投標文件編寫"
        description: "編寫投標 / 商務回應 / 技術應答的智能體；基於招標文件評分項與歷史標書、行業規範、企業資質材料，生成滿足評標辦法的投標文件草稿，可轉 docx。"
      en-US:
        name: "Bid Document Writer"
        description: "Write tender / commercial / technical bid responses grounded in scoring criteria, historical bids, industry standards, and enterprise qualifications. Markdown → optional docx."
      ja-JP:
        name: "入札ドキュメント作成"
        description: "入札 / 商務応答 / 技術応答を作成するエージェント。入札評価項目と歷史入札、業界規範、企業資格情報に基づき、評価基準を満たす入札ドラフトを生成、docx 出力可。"
      ko-KR:
        name: "입찰 문서 작성"
        description: "입찰 / 상업 응답 / 기술 응답 작성 에이전트. 평가 항목과 과거 입찰, 업계 규범, 기업 자격 자료로 평가 기준에 맞는 입찰 초안을 생성하고 docx 변환 가능."
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "bid_writer_chat"
      temperature: 0.5
      max_completion_tokens: 8192
      max_iterations: 30
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      retain_retrieval_history: false
      allowed_tools:
        - "knowledge_search"
        - "grep_chunks"
        - "get_document_info"
        # 文件读取 + 图片提取：在 Stage 1 之前的预处理流程用到
        # - kb_get_file：把 KB 里的原始投标文件（PDF/DOCX/XLSX）落到 /workspace/input
        # - kb_get_image：把 KB 文件里附带的图片（figure / 表格截图）落到 /workspace/output/images
        # - wiki_read_page：读 wiki 摘要页（如果 KB 文档有 wiki summary，优先走这条）
        - "kb_get_file"
        - "kb_get_image"
        - "wiki_read_page"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true
      history_turns: 3
      embedding_top_k: 5
      keyword_threshold: 0.2
      vector_threshold: 0.4
      rerank_top_k: 5
      rerank_threshold: 0.2
      enable_query_expansion: true
      enable_rewrite: false
      # Skills + Sandbox：让生成 agent 能调用 office-template-fill 把 Markdown 草稿转为 docx
      skills_selection_mode: "all"
      sandbox_config_id: "cd4aff88-0880-424a-826c-3cd44de713e4"
      question_suggestions:
        starters:
          enabled: true
          mode: hybrid
          count: 8
          items:
            - "帮我拆解这份招标文件的评分表（商务 / 技术 / 经济），列出权重和否决项"
            - "基于这份招标文件，按评分项生成投标应答草稿（商务响应）"
            - "针对评分项 T-001 技术方案完整性，从历史标书里找参考段落写应答"
            - "检查我的投标报价是否超过最高限价，并和预算金额比对"
            - "列出本轮投标草稿里所有 `{{待填:xxx}}` 字段，并给出建议补充来源"
            - "把这份招标的应答草稿转成 docx（保留原招标文件结构）"
            - "在投标文件中找出与资质要求不一致的地方，标 high 风险"
            - "生成针对否决项的应答，确保满足所有 knockout=true 的项"

      # 对话专用：文档生成智能体，从 KB 中检索参考资料并生成 Markdown 草稿。
      # display_group=chat 让它出现在聊天下拉。
      display_group: "chat"

