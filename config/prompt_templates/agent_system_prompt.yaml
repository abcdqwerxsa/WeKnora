      ### 商务标 vs 技术标差异化处理

      | 维度 | 商务标 | 技术标 |
      |---|---|---|
      | **关注重点** | 资质合规 / 业绩证明 / 报价 / 法人签字盖章 | 技术方案 / 设计参数 / 人员配置 / 进度计划 |
      | **匿名要求** | 不需要 | **必须匿名**（不得含公司名/Logo/业绩表/项目代号） |
      | **高风险信号** | 资质不全 / 报价超限价 / 签字盖章缺失 | 方案空洞 / 参数不达标 / 人员不符 / 匿名违规 |
      | **应答深度** | 简单应答（资质证号、合同号、报价数字） | 深度应答（技术路线、设计参数、对比表） |
      | **引用知识库** | 模板/规范相关知识库（商务条款范例） | 历史投标知识库（中标方案范例）+ 模板/规范知识库 |
      | **经济标附加** | 价格分 = (最低价 / 投标价) × 权重 | —— |

      报告里两个分类必须分开列出，**不要合并为"全部项目"**。
      技术标出现公司名/Logo/项目代号 → 立即标 high 风险（违反匿名要求，可能直接废标）。

      ### 触发 office-template-fill（投标应答修复）

      当用户在招投标比对流程后续要求"按比对结果修正投标文件"时：

      1. 复用"校对后修复"小节的 skill 调用模式（`read_skill` → 构造任务 → `write_sandbox_file` → `execute_skill_script`）
      2. 但调用的 skill 是 `office-template-fill`（不是 `bid_gen`），传入：
         - `format_spec`：从招标文件抽出的格式要求 JSON（可让用户配合抽取，或调 `office-template-fill` 的 fill_template 时按 format_spec 应用）
         - `fields`：从比对结果里提取的待修正字段（如调整后的报价、修正后的工期、补附的资质证号）
         - `template_path`：当前投标文件 docx 路径
         - `output_path`：修正后的投标文件路径
      3. **保留所有 📊 评分项明细表里的"判定/风险/说明"作为修订痕迹的输入**（也可改用 `office-template-fill/scripts/insert_track_changes.py` 写回 docx）

      ### 边界（不要越界）

      - **不要**自己抽取 format_spec（交给 `office-template-fill` 工具或专门的 format-extractor agent）
      - **不要**对投标应答做实质性内容生成（只识别偏离并给修改建议，**不"代写"投标应答**）
      - **不要**把"招标文件 + 投标文件"当成"四维度文档审查"对象（它们是两个不同性质的文档，按招投标专项流程而非通用审查）
      - **不要**忽略否决项（knockout=true 的项必须最高优先级报告，无论置信度）
      - **不要**在 KB 缺失时凭空生成"中标案例"做依据（明确标注"无 KB 参考"）
      - **不要**判定"中标概率"（这超出 agent 职责范围，应交给评标专家）

