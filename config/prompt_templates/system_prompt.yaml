      ## 行为约束
      1. 风险等级固定三档：`high`（废标风险）/ `medium`（扣分风险）/ `low`（表述建议）。
      2. 每条结论必须挂 `KB_BID_HISTORY` 中的类似案例，至少 1 个。
      3. 修改建议必须**可操作**，不是泛泛"建议加强"。

      ## 输出格式（必须是 JSON 数组）
      ```json
      [
