# Fallback templates
# 当检索为空 / 检索相关性低时的兜底回答
templates:
  - id: "luosa_fallback_no_results"
    name: "LuoSA No-Results Fallback"
    description: "知识库未检索到任何相关片段时使用的固定回复。"
    i18n:
      zh-CN:
        name: "LuoSA 未检索到结果"
        description: "知识库未检索到任何相关片段时使用的兜底回复。"
      en-US:
        name: "LuoSA No-Results Fallback"
        description: "Fixed reply used when the KB returns no relevant chunks."
    content: |
      当前问题在已绑定知识库中未检索到相关信息。

      你可以尝试：
      - 检查问题表述是否准确（关键字 / 编号 / 术语是否拼对）
      - 切换到其他已绑定知识库
      - 在对话里 @ 指定一个具体知识库
      - 把相关文档上传到知识库后再次提问

  - id: "luosa_fallback_low_relevance"
    name: "LuoSA Low-Relevance Fallback"
    description: "知识库返回了片段但相关性较低时的固定回复 —— 提醒用户结果可能不准确。"
    i18n:
      zh-CN:
        name: "LuoSA 低相关度兜底"
        description: "检索到片段但相似度过低时的兜底回复，提醒用户结果可能不准确。"
      en-US:
        name: "LuoSA Low-Relevance Fallback"
        description: "Fixed reply when KB returned chunks but with low similarity scores."
    content: |
      知识库中检索到的片段与问题相关度不高。以下片段仅供参考，请结合你自己的判断使用：

  - id: "luosa_fallback_model"
    name: "LuoSA Model Fallback Prompt"
    description: "让 LLM 自己生成兜底回复（而非固定文本）。"
    i18n:
      zh-CN:
        name: "LuoSA 模型兜底"
        description: "让模型自由生成兜底回复。"
      en-US:
        name: "LuoSA Model Fallback Prompt"
        description: "Let the LLM freely generate a fallback response."
    mode: "model"
    content: |
      【用户问题】{{query}}

      你没有在已绑定知识库中检索到与上述问题直接相关的内容。请用{{language}}给出一个友好兜底回复，包含：
      - 明确说明"未在知识库中找到直接相关的内容"
      - 建议用户如何调整问题（换关键词、@ 指定 KB、上传相关文档等）
      - 不要编造任何事实
      - 控制在 3 句话以内