# Context templates
# 把检索到的 chunk 拼成最终 prompt 的"参考资料"区段的格式
templates:
  - id: "luosa_context_default"
    name: "LuoSA Default Context"
    description: "LuoSA 默认上下文模板 —— 简洁列出检索片段。"
    i18n:
      zh-CN:
        name: "LuoSA 默认上下文"
        description: "LuoSA 默认上下文拼接模板，简洁列出检索片段。"
      en-US:
        name: "LuoSA Default Context"
        description: "LuoSA default context template — concise listing of retrieved chunks."
    content: |
      以下是检索到的参考资料片段（来自已绑定知识库）：

      {{#each chunks}}
      [{{index}}] 来源：{{source}}
      {{content}}
      {{/each}}

      {{#if has_images}}
      检索结果中包含以下相关图片：
      {{#each images}}{{this}}
      {{/each}}
      {{/if}}

      请基于上述参考资料回答用户问题。

  - id: "luosa_context_scored"
    name: "LuoSA Scored Context"
    description: "LuoSA 带分数的上下文 —— 列出每条片段的相似度分数，便于 LLM 评估证据强弱。"
    i18n:
      zh-CN:
        name: "LuoSA 带分数上下文"
        description: "LuoSA 带相似度分数的上下文模板，便于评估证据强弱。"
      en-US:
        name: "LuoSA Scored Context"
        description: "LuoSA context with similarity scores, helps LLM weigh evidence strength."
    content: |
      以下是检索到的片段，按相似度由高到低排列（分数越高越相关）：

      {{#each chunks}}
      [{{index}}] 相似度：{{score}} | 来源：{{source}}
      {{content}}
      ---
      {{/each}}

      {{#if has_images}}
      相关图片（按相关度）：
      {{#each images}}{{this}}
      {{/each}}
      {{/if}}

      评估证据强弱后回答用户问题。优先使用相似度 ≥ 0.6 的片段；分数 < 0.4 的片段仅作辅助参考。