      ## 工作流程（按顺序，不可跳步）

      ### Stage 1：招标文件预处理

      **入口二选一**（按下面顺序判断，能命中就停下来，不要三个都跑）：

      1. **聊天附件**：用户本轮上传了招标文件 / 招标附件（PDF/DOCX/XLSX）
         - 系统已自动落到 `/workspace/input/<sha>/<原文件名>`
         - 用 `list_sandbox_files /workspace/input` 拿路径，`read_sandbox_file` 整体读
         - **不要**走 `kb_get_file`（避免对已落好的附件做无意义的再下载）

      2. **KB 文档（无 wiki summary）**：用户指了 KB 中某份招标文件
         - 先 `get_document_info` 拿 `knowledge_id`
         - 再 `kb_get_file(knowledge_id=<id>)` 把原文件落到 `/workspace/input/<sha>/<原文件名>`
         - 然后 `read_sandbox_file` 读全文

      3. **KB 文档（有 wiki summary）**：KB 是 wiki 模式
         - 直接 `wiki_read_page(slug=<wiki_path>)` 读摘要
         - 摘要里说"详见源文档 §X"且后面要嵌具体参数 / 图片 → 再走入口 2 拿原文

      ### Stage 2：评分项拆解

      - 用 `knowledge_search` 在招标文件 KB 检索"评分表 / 评标办法 / 评分细则"
      - 用 `grep_chunks` 按结构化正则抽评分项（**商务 / 技术 / 经济**三类分开）
      - 按五元组 schema 输出：`[{id, category: tech|commercial|price, title, weight, criteria, knockout}]`
      - 同时扫描"评标办法"识别：**否决项 / 最高限价 / 技术标匿名 / 签字盖章** 等废标红线信号

      ### Stage 3：应答检索 + 生成

      对每个评分项：
      1. 在已绑定 KB 里检索"历史投标应答 + 类似项目 + 资质证明 + 行业规范"
         - 检索条件带 `kb_ids` 限定，不要混入招标文件 KB
         - 文档过长时分章节检索
         - **不要重复检索同一个词**
      2. 判定满足 / 正偏离 / 负偏离 / 缺失（详见"## 判定表"）
      3. 撰写应答段落：
         - **关键事实**（业绩 / 资质 / 人员 / 参数 / 合同号）必须挂源或用占位符
         - **业绩 / 资质 / 报价数字** 找不到来源 → `{{待填:xxx}}`
         - **涉法 / 涉密** → `{{待人工复核:xxx}}`
         - **事后核实** → `{{TBV:xxx}}`
      4. 把每条评分项的"应答段 + 判定 + 风险"作为独立章节写入投标文件

      ### Stage 4：跨文档一致性二次校核

      - 用 `grep_chunks` 在投标草稿里抽金额 / 日期 / 人员 / 资质编号
      - 与招标文件评分项里的基准值比对：
        - 报价 vs 最高限价（**超限价 = 立即废标**）
        - 项目经理 / 总工 vs 招标要求
        - 资质等级 vs 招标要求
        - 关键日期（开标 / 工期 / 质保期）vs 招标要求
      - 冲突 → 升级为 high 风险，必须修正后再输出

      ### Stage 5：自校核 + 待填清单

      - 通读整份草稿，列出所有 `{{待填:xxx}}` / `{{待人工复核:xxx}}` / `{{TBV:xxx}}`
      - 输出"待填字段清单"（表格：字段 / 紧急度 / 含义 / 建议来源）
      - **置信度 < 0.7 的事实不要写入正文**

      ## 判定表（每个评分项的判定）

      | 判定 | 含义 | 风险 |
      |---|---|---|
      | ✅ **满足** | 应答完整覆盖评分标准 | 无 |
      | ⬆️ **正偏离** | 应答超出 / 优于评分标准（更短工期 / 更高质保期 / 更高资质） | 建议保留（可加分） |
      | ⬇️ **负偏离** | 应答低于评分标准（工期超 / 参数不达标 / 资质不足） | medium-high，必须修正 |
      | ❌ **缺失** | 应答完全没有 | high，最高风险，可能直接废标 |
      | ⚠️ **部分满足** | 应答存在但未完全覆盖 | medium，列出缺失点 |

