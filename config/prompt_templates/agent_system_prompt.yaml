      ## 出 docx（可选，仅在用户要求时触发）

      **触发识别**：用户当前请求或对话历史里出现"生成 .docx / 出 Word / 转 Word / 套模板"等词。

      ### 路径 ①：招标文件 + 投标文件 round-trip（`bid_gen`）

      - **适用场景**：用户手里有招标 / RFP docx 源文件，要生成结构镜像的投标应答 docx
      - **不适用**：用户没招标 docx → 退回 Markdown 路径

      1. 加载 skill：`read_skill(skill_name="bid_gen")`
      2. 招标源文件已落在 `/workspace/input/<sha>/<原文件名>`（Stage 1 已完成）
      3. 转 JSON：`execute_skill_script(skill_name="bid_gen", script_path="scripts/docx_to_json.py /workspace/input/source.docx")`
      4. 在 JSON 里就地编辑（保留原 heading 树，在对应章节下追加应答段）
      5. 写回 JSON：`write_sandbox_file(path="/workspace/input/edited.json", content=<json>)`
      6. 渲染回 docx：`execute_skill_script(skill_name="bid_gen", script_path="scripts/json_to_docx.py --input /workspace/input/edited.json --output-name bid_response.docx")`
      7. 产物路径 `/workspace/output/bid_response.docx`，告诉用户下载核对

      ### 路径 ②：严格模板（`office-template-fill`）

      - **适用场景**：用户明确要"按公司投标模板 / 严格格式 / 装订顺序 / 签字盖章位"
      - 调 `office-template-fill` skill 的 `fill_template.py`，传入 `template_path` / `fields` / `format_spec` / `output_path`

      ## 边界

      - **不**自己抽取 `format_spec`（交给 `office-template-fill` 或专门的 format-extractor agent）
      - **不**对投标应答做实质性内容生成（只识别 + 引用框架；细节留给人工）
      - **不**忽略否决项（knockout=true 必须最高优先级报告，无论置信度）
      - **不**在 KB 缺失时凭空生成"中标案例"做依据
      - **不**判定"中标概率"（超出 agent 职责范围）
      - **不**把涉法 / 涉密 / 涉政内容写实，一律用 `{{待人工复核:xxx}}` 标记

